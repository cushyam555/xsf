name: Test and build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
  build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Build portable GUI and console executables
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name XSF-to-SF2 main.py
          python -m PyInstaller --noconfirm --clean --onefile --console --name XSF-to-SF2-CLI main.py
      - name: Test packaged programs
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from tests.fixtures import write_pair; write_pair(Path('.'))"
          & dist/XSF-to-SF2-CLI.exe --cli test.xsf packaged.sf2
          if ($LASTEXITCODE -ne 0) { throw 'Packaged converter failed' }
          python -c "from pathlib import Path; from tests.fixtures import soundfont; assert Path('packaged.sf2').read_bytes() == soundfont()"
          python -c "from pathlib import Path; from tests.fixtures import encrypted, soundfont; Path('shifted.xsf').write_bytes(encrypted(soundfont(), prefix=bytes(range(24))))"
          & dist/XSF-to-SF2-CLI.exe --cli shifted.xsf shifted.sf2
          if ($LASTEXITCODE -ne 0) { throw 'Packaged shifted-header converter failed' }
          python -c "from pathlib import Path; from tests.fixtures import soundfont; assert Path('shifted.sf2').read_bytes() == soundfont()"
          $process = Start-Process -FilePath 'dist/XSF-to-SF2.exe' -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          $windows = @()
          do {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { throw 'GUI exited during startup' }
            # PyInstaller onefile creates a child process that owns the window.
            $windows = @(Get-Process -Name 'XSF-to-SF2' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })
          } while ($windows.Count -eq 0 -and (Get-Date) -lt $deadline)
          if ($windows.Count -eq 0) { throw 'GUI window was not created' }
          Get-Process -Name 'XSF-to-SF2' -ErrorAction SilentlyContinue | Stop-Process
      - name: Package download
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/XSF-to-SF2.exe,dist/XSF-to-SF2-CLI.exe,dist/README.md -DestinationPath dist/XSF-to-SF2-Windows-x64.zip
          Get-FileHash dist/XSF-to-SF2-Windows-x64.zip -Algorithm SHA256 | ForEach-Object { ($_.Hash.ToLower() + '  XSF-to-SF2-Windows-x64.zip') } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XSF-to-SF2-Windows-x64
          path: |
            dist/XSF-to-SF2-Windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG dist/XSF-to-SF2-Windows-x64.zip dist/SHA256SUMS.txt --title "XSF to SF2 $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md --verify-tag
